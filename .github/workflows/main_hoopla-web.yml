# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - hoopla-web

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://index.docker.io/v1/
        username: ${{ secrets.AzureAppService_ContainerUsername_3309c9e0ef584197a88ab5c5128d0c1e }}
        password: ${{ secrets.AzureAppService_ContainerPassword_677453dafd2f4425a89443ebc96df953 }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: index.docker.io/${{ secrets.AzureAppService_ContainerUsername_3309c9e0ef584197a88ab5c5128d0c1e }}/hoopla-web:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'hoopla-web'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_5572101a77a043c19b10c73b8e5c49f9 }}
        images: 'index.docker.io/${{ secrets.AzureAppService_ContainerUsername_3309c9e0ef584197a88ab5c5128d0c1e }}/hoopla-web:${{ github.sha }}'